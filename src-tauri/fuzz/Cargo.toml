[package]
name = "tablio-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standard cargo-fuzz layout. The `cargo fuzz init` command would generate
# something equivalent; we pin it manually so the workflow doesn't need to
# rerun init on a fresh runner. To regenerate (or add a target):
#   cargo +nightly fuzz add <target>
# The nightly toolchain is required because libfuzzer-sys depends on
# unstable LLVM sanitiser interfaces.

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# The parent crate publishes its package as `tablio` and its library as
# `tablio_lib` (see `[package].name` and `[lib].name` in ../Cargo.toml).
# Cargo path deps resolve by *package* name, so we depend on `tablio`
# here; the targets still `use tablio_lib::…` because that is the lib's
# public crate name.
#
# This fuzz crate is intentionally outside the parent workspace (per
# `[workspace]` below), which means it has its own dependency
# resolution. To keep the resolved tauri / tauri-build / tauri-codegen
# / tauri-runtime versions identical to what the parent compiles
# against (otherwise the codegen + runtime drift across minor
# releases — e.g. `ResolvedCommand` adding a `referenced_by` field —
# breaks `tauri::generate_handler!` expansion), the committed
# `Cargo.lock` next to this manifest pins the same versions the parent
# uses. CI invokes `cargo fuzz run` which respects the lockfile;
# regenerate via `cargo +nightly update` only after verifying the new
# tauri family compiles in both crates.
[dependencies.tablio]
path = ".."

# Each fuzz target is its own bin so libfuzzer can link them with a custom
# `_LLVMFuzzerTestOneInput` entry point. Keep the per-target sections
# minimal — adding `test = false` and `doc = false` shaves a small but
# noticeable chunk off cold-build time on CI.

# cargo-fuzz appends `-Cdebug-assertions` to RUSTFLAGS, which only affects
# *target* crates (the path that consumes `tauri::generate_context!()`).
# Build-script deps and proc-macros are compiled via `build-override`,
# which defaults to `debug-assertions = false`. `tauri-utils` gates the
# `ResolvedCommand::referenced_by` field *and* the `ToTokens` impl that
# materialises that field on `#[cfg(debug_assertions)]`. When the two
# compilation contexts disagree, `tauri-build`'s codegen emits a struct
# literal that omits `referenced_by` while the target-side struct
# definition still requires it, producing
#   error[E0063]: missing field `referenced_by` in initializer of `ResolvedCommand`
# during fuzz builds. Forcing debug-assertions on for build-overrides
# realigns the two contexts so the generated tokens match the struct shape.
[profile.release.build-override]
debug-assertions = true

[[bin]]
name = "ssh_config"
path = "fuzz_targets/ssh_config.rs"
test = false
doc = false

[[bin]]
name = "proc_self_stat"
path = "fuzz_targets/proc_self_stat.rs"
test = false
doc = false

[[bin]]
name = "sql_identifier"
path = "fuzz_targets/sql_identifier.rs"
test = false
doc = false

# We deliberately do NOT add `tablio-fuzz` to the workspace — cargo-fuzz
# nests this crate under the parent so the `cargo fuzz` subcommand can
# locate it via path conventions, but workspace membership would force
# the libfuzzer-sys dep into the parent build's lockfile.
[workspace]
