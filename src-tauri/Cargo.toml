[package]
name = "tablio"
version = "0.4.2"
edition = "2021"

[lib]
name = "tablio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "json",
    "chrono",
    "uuid",
    "rust_decimal",
] }
rust_decimal = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tauri-plugin-dialog = "2.6.0"
sysinfo = "0.38.4"
scylla = "1.5"
tiberius = { version = "0.12.3", default-features = false, features = ["tokio", "rustls", "tds73"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
urlencoding = "2.1.3"
russh = "0.60"
log = "0.4"
rust_xlsxwriter = { version = "0.94", features = ["chrono"] }
calamine = { version = "0.34", features = ["dates"] }

# Windows-only direct dep so we can name `pageant::PageantStream` in the
# return type of `connect_agent()` on Windows. russh 0.60 already pulls
# pageant 0.2 in transitively (its `AgentClient::connect_pageant()` returns
# `AgentClient<pageant::PageantStream>`), but doesn't re-export the type, so
# we declare it explicitly here.
[target.'cfg(windows)'.dependencies]
pageant = "0.2"

[dev-dependencies]
tempfile = "3"
which = "8"
proptest = "1"
