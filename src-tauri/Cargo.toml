[package]
name = "tablio"
version = "0.5.3"
edition = "2021"

[lib]
name = "tablio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to 0.9.0-alpha.1 (rather than the latest stable 0.8.6)
# because sqlx-sqlite 0.8.6 pins libsqlite3-sys ^0.30.1, which only
# bundles SQLite 3.46.0. The `if()` SQL function landed in SQLite
# 3.48 and is a real user requirement (#126), so we need a newer
# bundled engine. sqlx 0.9.0-alpha.1 widens that constraint to
# `>=0.30.0, <0.36.0`, letting Cargo resolve libsqlite3-sys 0.35.x
# which bundles SQLite 3.50.x. Pin the exact alpha version to
# avoid surprise breakage from future 0.9 alphas.
sqlx = { version = "=0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    # Required for MySQL 8 `caching_sha2_password` / `sha256_password`
    # auth over non-TLS connections; opt-in since sqlx 0.9.
    "mysql-rsa",
    "sqlite",
    "json",
    "chrono",
    "uuid",
    "rust_decimal",
] }
rust_decimal = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
tauri-plugin-dialog = "2.6.0"
# Pin sysinfo to the latest version that still supports our MSRV
# (rustc 1.93). 0.39.x bumped the rust-version metadata to 1.95.
# Bumping our toolchain is out of scope for this fix release.
sysinfo = "0.40"
scylla = "1.5"
tiberius = { version = "0.13.0", default-features = false, features = ["tokio", "rustls", "tds73"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
# Stream helpers for reading every result set of a console query.
futures-util = "0.3"
urlencoding = "2.1.3"
russh = "0.65"
# Used to match hashed (`|1|salt|hash`) hostnames in known_hosts files;
# same versions russh already depends on.
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2.3"
log = "0.4"
rust_xlsxwriter = { version = "0.102", features = ["chrono"] }
calamine = { version = "0.38", features = ["dates"] }
# Private (0600) temp files for dumps and atomic config writes.
tempfile = "3"
# Connection passwords live in the OS credential store: macOS Keychain,
# Windows Credential Manager, Secret Service on Linux. The Linux backend
# is the zbus-based one (pure Rust, no libdbus needed at build or run
# time) driven by zbus' own async-io executor, so it never touches the
# tokio runtime.
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    "async-secret-service",
    "async-io",
    "crypto-rust",
] }

# Windows-only direct dep so we can name `pageant::PageantStream` in the
# return type of `connect_agent()` on Windows. russh 0.60 already pulls
# pageant 0.2 in transitively (its `AgentClient::connect_pageant()` returns
# `AgentClient<pageant::PageantStream>`), but doesn't re-export the type, so
# we declare it explicitly here.
# Linux-only: read all stored connection secrets in one Secret Service
# session (see `KeyringStore::get_all`). Same crate and features `keyring`
# already uses there, so this adds nothing to the build.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
pageant = "0.2"

[dev-dependencies]
which = "8"
proptest = "1"

# sqlx-core with TCP_NODELAY on its sockets; see vendor/sqlx-core/TABLIO_PATCH.md.
[patch.crates-io]
sqlx-core = { path = "vendor/sqlx-core" }
