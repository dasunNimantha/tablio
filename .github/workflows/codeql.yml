name: CodeQL

# Why advanced setup instead of GitHub's default code-scanning?
#
#   * Default setup ALWAYS runs on every PR to the default branch and
#     on every push. There's no knob in repo settings to turn that off
#     — the only way to scan on a custom schedule is to disable default
#     setup and supply this advanced-setup workflow.
#   * Per-push scanning duplicates work the regular CI matrix already
#     covers (clippy on Rust, eslint+vitest on TS, etc.) and adds
#     ~10 minutes per push for findings that almost never need to be
#     addressed before merge.
#   * A nightly schedule keeps the security tab fresh without paying
#     that per-push tax. Findings introduced during the day surface in
#     the next morning's run, which matches how we already triage
#     advisory output from the Nightly workflow.
#
# Languages match what default setup was configured for as of
# 2026-04-30 ({"actions","javascript","javascript-typescript","rust",
# "typescript"} — the `javascript` and `typescript` slots are aliases
# of `javascript-typescript` so we collapse them here).

on:
  schedule:
    # Nightly at 03:27 UTC. Off-the-hour minute keeps us out of GitHub's
    # top-of-hour burst window, and 03:27 sits ~30 min before the main
    # `nightly.yml` cron at 04:00 UTC so they don't compete for runners.
    - cron: "27 3 * * *"
  workflow_dispatch:

# `security-events: write` is the only token scope CodeQL strictly
# needs (to upload SARIF). `contents: read` for checkout, `actions: read`
# for workflow analysis. Nothing else.
permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@v7

      # Tauri's Rust crate needs the same system libs CI's other Rust
      # jobs install — the autobuild step shells out to `cargo build`,
      # which would otherwise fail on missing webkit2gtk headers.
      - name: Install Linux deps (Rust autobuild prerequisite)
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # No `queries:` input — that's the right way to ask for the
          # action's standard suite per language (which is what default
          # setup was running). The literal string `default` is not a
          # valid pack reference in codeql-action v4 and made every run
          # fail with: "A fatal error occurred: Query pack `default`
          # cannot be found." If we ever want broader coverage, set
          # `queries: security-extended` here.

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
